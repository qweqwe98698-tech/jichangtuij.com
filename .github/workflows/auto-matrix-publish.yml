name: Auto Publish SEO/GEO Matrix Article

on:
  schedule:
    # 每 4 天 UTC 02:00（北京时间 10:00）自动执行一次
    - cron: '0 2 */4 * *'
  # 支持在 GitHub Actions 网页端随时手动一键触发执行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-matrix-article:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate 10,000-Word SEO/GEO Matrix Article via DeepSeek API
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/generate-matrix-article.mjs

      - name: Commit and Push Changes (Trigger CI/CD)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 检查是否有新文章产生
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            # 严格按照规范：绝不添加 [skip ci]，确保提交后正常触发后续 Cloudflare/构建部署流水线
            git commit -m "chore(content): auto-publish new 10,000-word SEO/GEO matrix article"
            git push origin main
            echo "✓ 新专题矩阵文章已成功生成并推送到 main 分支，CI/CD 部署流水线已触发！"
          else
            echo "没有产生新的内容变更，跳过提交。"
          fi
