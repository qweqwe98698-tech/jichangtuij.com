    stroke="#ffffff"
    stroke-width="4.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 三节点 -->
  <circle cx="24.8" cy="30.6" r="3" fill="#ffffff"/>
  <circle cx="32.6" cy="25.2" r="3" fill="#8dc8ff"/>
  <circle cx="40.4" cy="31.6" r="3" fill="#ffffff"/>
</svg>
