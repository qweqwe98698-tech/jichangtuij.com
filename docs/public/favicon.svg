    d="M22.6 40.8a8 8 0 0 1-.6-15.9 11 11 0 0 1 20.6-3.2 8.4 8.4 0 0 1 .9 19.1h-7.9v5.6a5.9 5.9 0 0 1-10.6 3.6"
