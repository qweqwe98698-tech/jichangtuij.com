<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="机场云">
  <title>机场云 JichangCloud</title>
  <defs>
    <linearGradient id="jcFavBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#246bfd"/>
      <stop offset="100%" stop-color="#164ec5"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#jcFavBg)"/>

  <!-- 云体 + J 钩笔，实心白色，保证 16px 下依然清晰 -->
