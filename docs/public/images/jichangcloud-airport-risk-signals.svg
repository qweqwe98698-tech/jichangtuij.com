<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="jcT5 jcD5">
  <title id="jcT5">机场风险信号分级判断示意图</title>
  <desc id="jcD5">四级阶梯图，从左到右风险依次升高：单项信号保持观察，两项信号停止长周期续费，三项以上缩短付款周期并切换主力线路，支付渠道频繁更换等极高风险则停止付款并尽快迁移。</desc>
  <style>
    .l{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:15px;font-weight:700;fill:#3d5a80}
    .s{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:12.5px;fill:#6b7f99}
    .a{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:12.5px;font-weight:700;fill:#3d5a80}
    .k{stroke:#5b8fd6;stroke-width:2}
  </style>
  <text class="l" x="20" y="32">风险判断看的是信号组合，不是单一现象</text>

  <rect class="k" x="20" y="212" width="200" height="60" rx="10" fill="#eef7f8"/>
  <text class="a" x="40" y="238">低 · 保持观察</text>
  <text class="s" x="40" y="258">单项信号且可被合理解释</text>

  <rect class="k" x="232" y="164" width="200" height="108" rx="10" fill="#f0f6fb"/>
  <text class="a" x="252" y="190">中 · 停止长周期续费</text>
  <text class="s" x="252" y="212">两项信号同时出现</text>
  <text class="s" x="252" y="234">准备一条备用线路</text>

  <rect class="k" x="444" y="116" width="200" height="156" rx="10" fill="#faf3e8"/>
  <text class="a" x="464" y="142">高 · 缩短付款周期</text>
  <text class="s" x="464" y="164">三项以上信号</text>
  <text class="s" x="464" y="186">客服回避具体问题</text>
  <text class="s" x="464" y="208">切换主力线路</text>

  <rect class="k" x="656" y="68" width="204" height="204" rx="10" fill="#f8ecec"/>
  <text class="a" x="676" y="94">极高 · 停止付款</text>
  <text class="s" x="676" y="116">支付渠道频繁更换</text>
  <text class="s" x="676" y="138">只推长期或一次性套餐</text>
  <text class="s" x="676" y="160">节点大面积长期维护</text>
  <text class="s" x="676" y="182">导出必要信息</text>
  <text class="s" x="676" y="204">尽快完成迁移</text>
</svg>
