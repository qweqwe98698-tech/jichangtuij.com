<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="jcT25 jcD25">
  <title id="jcT25">带宽波动与播放器自动画质切换的关系</title>
  <desc id="jcD25">上方为带宽曲线，随时间波动，标出晚高峰时段出现的低谷；下方为对应的画质阶梯，播放器依据实测带宽自动升降画质，带宽跌破某个画质所需的持续水平时立即降级，恢复后逐步回升。图中标注峰值速度高不代表持续带宽稳定，播放器参考的是能维持的最低水平而非峰值。</desc>
  <style>
    .l{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;font-weight:700;fill:#3d5a80}
    .s{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#6b7f99}
    .r{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#c07a2a}
    .g{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#2f8f7a}
    .curve{stroke:#48b7c7;stroke-width:2.4;fill:none}
    .thresh{stroke:#b8c8dc;stroke-width:1.4;stroke-dasharray:4 4;fill:none}
    .step{fill:#eef4fb;stroke:#5b8fd6;stroke-width:1.4}
    .stepbad{fill:#fbeeee;stroke:#cf8a8a;stroke-width:1.4}
  </style>

  <text class="l" x="20" y="24">播放器依据能持续维持的带宽调整画质，不是依据峰值</text>

  <!-- 带宽曲线 -->
  <text class="s" x="20" y="46">带宽（持续水平）</text>
  <path class="curve" d="M60 70 C110 60,150 62,190 78 C230 94,250 130,285 150 C320 170,355 168,390 140 C425 112,445 78,480 66 C515 54,550 58,585 76 C620 94,640 128,675 148 C710 168,730 166,750 150"/>
  <line class="thresh" x1="60" y1="100" x2="750" y2="100"/>
  <text class="s" x="756" y="104">1080p 阈值</text>
  <line class="thresh" x1="60" y1="140" x2="750" y2="140"/>
  <text class="s" x="756" y="144">720p 阈值</text>

  <rect x="260" y="150" width="120" height="20" fill="#fbeeee" opacity="0.6"/>
  <text class="r" x="270" y="164">晚高峰低谷</text>

  <!-- 画质阶梯 -->
  <text class="s" x="20" y="212">画质</text>
  <rect class="step" x="60" y="220" width="140" height="30"/>
  <text class="g" x="80" y="240">1080p</text>
  <rect class="stepbad" x="200" y="220" width="140" height="30"/>
  <text class="r" x="220" y="240">480p（降级）</text>
  <rect class="step" x="340" y="220" width="160" height="30"/>
  <text class="g" x="380" y="240">1080p（回升）</text>
  <rect class="stepbad" x="500" y="220" width="140" height="30"/>
  <text class="r" x="520" y="240">720p（降级）</text>
  <rect class="step" x="640" y="220" width="180" height="30"/>
  <text class="g" x="680" y="240">1080p（回升）</text>

  <line x1="20" y1="278" x2="860" y2="278" stroke="#e3ebf5"/>
  <text class="s" x="20" y="300">峰值测速跑得再高，只要持续带宽在观看期间跌破阈值，画质照样会降级 —— 这就是「测速很快但还是卡」的机制原因。</text>
  <text class="s" x="20" y="320">判断依据应该是观看时段的持续表现，而不是空闲时刻测出的峰值数字。</text>
</svg>
