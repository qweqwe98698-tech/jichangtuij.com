<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="jcT26 jcD26">
  <title id="jcT26">iOS 网络切换时代理连接的中断与重建时间线</title>
  <desc id="jcD26">一条时间线展示 iOS 设备从 WiFi 切换到蜂窝网络的过程：切换发生时旧连接全部中断，客户端需要在新网络上重建到节点的连接，期间出现几秒的断流窗口；重建完成后恢复正常。下方标注：这属于系统网络栈的行为，不是客户端故障；会话敏感的操作（视频会议、支付、AI 长对话）应避开网络切换时刻。</desc>
  <style>
    .l{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;font-weight:700;fill:#3d5a80}
    .s{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#6b7f99}
    .r{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#c07a2a}
    .g{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#2f8f7a}
    .axis{stroke:#7f95b0;stroke-width:1.8;fill:none}
    .ok{stroke:#48b7c7;stroke-width:5;fill:none;stroke-linecap:round}
    .gap{stroke:#cf8a8a;stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:3 7}
    .mark{stroke:#c07a2a;stroke-width:1.6;stroke-dasharray:5 4}
  </style>

  <text class="l" x="20" y="26">从 WiFi 到蜂窝：中间必然有一段断流窗口</text>

  <!-- 时间线 -->
  <line class="axis" x1="60" y1="150" x2="820" y2="150"/>

  <path class="ok" d="M80 150 H360"/>
  <text class="g" x="120" y="130">WiFi 下连接正常</text>

  <line class="mark" x1="360" y1="90" x2="360" y2="200"/>
  <text class="r" x="300" y="80">网络切换发生</text>

  <path class="gap" d="M360 150 H520"/>
  <text class="r" x="376" y="130">断流窗口：旧连接全部中断，</text>
  <text class="r" x="376" y="112">客户端在新网络上重建连接</text>

  <path class="ok" d="M520 150 H800"/>
  <text class="g" x="560" y="130">蜂窝网络下恢复正常</text>

  <text class="s" x="80" y="180">解锁手机、离开家、进电梯，都可能触发这条时间线</text>

  <text class="s" x="20" y="236">这段中断来自系统网络栈的行为：网络接口变了，所有旧连接都必须重建——它不是客户端故障，也不是节点故障。</text>
  <text class="s" x="20" y="258">不同客户端的差别只在重建速度与自动化程度。</text>
  <text class="r" x="20" y="288">实用建议：视频会议、支付、AI 长对话等会话敏感操作，避开可预见的网络切换时刻；切换后等连接指示恢复再继续。</text>
</svg>
