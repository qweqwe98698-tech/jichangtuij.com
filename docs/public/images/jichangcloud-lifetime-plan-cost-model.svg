<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="jcT21 jcD21">
  <title id="jcT21">一次性收费与持续成本的时间轴对比</title>
  <desc id="jcD21">一条时间轴上有两条曲线：一次性收费在售出时一次到账后不再增长；带宽、服务器与运维成本随时间持续累积并不断上升。两条线在某个时间点交叉，交叉点之后每继续服务一天都在亏损。永久套餐的承诺覆盖的正是交叉点之后的无限期区间，这在成本模型上无法成立。</desc>
  <style>
    .l{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;font-weight:700;fill:#3d5a80}
    .s{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#6b7f99}
    .r{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#c07a2a}
    .g{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#2f8f7a}
    .axis{stroke:#7f95b0;stroke-width:1.8;fill:none}
    .income{stroke:#48b7c7;stroke-width:2.6;fill:none}
    .cost{stroke:#cf8a8a;stroke-width:2.6;fill:none}
    .mark{stroke:#c07a2a;stroke-width:1.6;stroke-dasharray:5 4}
  </style>
  <defs>
    <marker id="jcAr21" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#7f95b0"/>
    </marker>
  </defs>

  <text class="l" x="20" y="26">「永久」承诺的问题不在意愿，而在算术</text>

  <!-- 坐标轴 -->
  <path class="axis" d="M80 250 H800" marker-end="url(#jcAr21)"/>
  <path class="axis" d="M80 250 V60" marker-end="url(#jcAr21)"/>
  <text class="s" x="790" y="272">时间</text>
  <text class="s" x="30" y="70">金额</text>

  <!-- 一次性收入：阶跃后持平 -->
  <path class="income" d="M80 250 L110 130 H760"/>
  <text class="g" x="130" y="118">一次性收入：售出时到账，之后不再增长</text>

  <!-- 持续成本：线性上升 -->
  <path class="cost" d="M80 250 L760 90"/>
  <text class="r" x="470" y="112">带宽 + 服务器 + 运维：随时间持续累积</text>

  <!-- 交叉点 -->
  <line class="mark" x1="418" y1="250" x2="418" y2="130"/>
  <text class="r" x="330" y="292">交叉点：累积成本追上一次性收入</text>
  <text class="s" x="330" y="312">此后每继续服务一天都在亏损，而「永久」承诺覆盖的恰恰是这段无限期区间</text>

  <text class="s" x="440" y="70">用户量越大、使用越活跃，交叉点来得越早</text>
</svg>
