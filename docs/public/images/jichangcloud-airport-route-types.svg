<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="jcT2 jcD2">
  <title id="jcT2">直连、中转与专线三种线路结构对比图</title>
  <desc id="jcD2">三条横向路径分别表示直连、公网中转与跨境专线，标出各自经过的环节，以及晚高峰时最容易发生拥堵的位置。</desc>
  <style>
    .l{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:15px;font-weight:700;fill:#3d5a80}
    .s{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:12px;fill:#6b7f99}
    .w{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#c07a2a}
    .n{fill:#ffffff;stroke:#5b8fd6;stroke-width:2}
    .p{stroke:#9bb6d8;stroke-width:2.5;fill:none}
    .f{stroke:#48b7c7;stroke-width:2.5;fill:none}
  </style>
  <text class="l" x="20" y="34">线路结构决定体验上限</text>

  <text class="l" x="20" y="88">直连</text>
  <path class="p" d="M96 82 H820"/>
  <circle class="n" cx="96" cy="82" r="8"/><circle class="n" cx="820" cy="82" r="8"/>
  <text class="s" x="80" y="110">本地</text>
  <text class="s" x="794" y="110">落地</text>
  <text class="w" x="360" y="70">公网跨境段：晚高峰最容易拥堵</text>

  <text class="l" x="20" y="176">中转</text>
  <path class="p" d="M96 170 H820"/>
  <circle class="n" cx="96" cy="170" r="8"/>
  <circle class="n" cx="420" cy="170" r="9"/>
  <circle class="n" cx="820" cy="170" r="8"/>
  <text class="s" x="80" y="198">本地</text>
  <text class="s" x="386" y="198">入口 / 中转</text>
  <text class="s" x="794" y="198">落地</text>
  <text class="w" x="140" y="158">入口质量决定国内段体感</text>

  <text class="l" x="20" y="264">专线</text>
  <path class="p" d="M96 258 H360"/>
  <path class="f" d="M360 258 H660" stroke-dasharray="9 7"/>
  <path class="p" d="M660 258 H820"/>
  <circle class="n" cx="96" cy="258" r="8"/>
  <circle class="n" cx="360" cy="258" r="9"/>
  <circle class="n" cx="660" cy="258" r="9"/>
  <circle class="n" cx="820" cy="258" r="8"/>
  <text class="s" x="80" y="286">本地</text>
  <text class="s" x="336" y="286">入口</text>
  <text class="s" x="628" y="286">境外落地</text>
  <text class="s" x="794" y="286">目标</text>
  <text class="w" x="374" y="246">运营商专用链路：不与公网争抢，但仍可能被超售</text>
</svg>
