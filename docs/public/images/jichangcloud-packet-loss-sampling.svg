<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-labelledby="jcT11 jcD11">
  <title id="jcT11">连续测量与短时抽样在发现间歇性丢包上的差异</title>
  <desc id="jcD11">上方是一条晚间时间轴，其中分布着三段间歇性丢包时段。中间一行表示短时抽样：抽到的窗口恰好落在两段丢包之间，于是误判为线路正常。下方一行表示连续测量：覆盖完整时段，三段间歇性丢包全部被记录下来。</desc>
  <style>
    .l{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;font-weight:700;fill:#3d5a80}
    .s{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#6b7f99}
    .r{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#c07a2a}
    .g{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:11.5px;fill:#2f8f7a}
    .axis{stroke:#7f95b0;stroke-width:1.8;fill:none}
    .loss{fill:#cf8a8a}
    .win{stroke:#c07a2a;stroke-width:2.4;fill:none}
    .full{stroke:#48b7c7;stroke-width:2.4;fill:none}
  </style>

  <text class="l" x="20" y="26">同一条线路、同一个晚上：两种测法得到两个相反的结论</text>

  <!-- 时间轴与丢包时段 -->
  <line class="axis" x1="120" y1="90" x2="760" y2="90"/>
  <text class="s" x="104" y="72">20:00</text>
  <text class="s" x="732" y="72">24:00</text>
  <rect class="loss" x="185" y="82" width="34" height="16" rx="3"/>
  <rect class="loss" x="420" y="82" width="52" height="16" rx="3"/>
  <rect class="loss" x="640" y="82" width="30" height="16" rx="3"/>
  <text class="r" x="20" y="95">间歇性丢包</text>
  <text class="s" x="185" y="120">丢包不是均匀发生的，而是集中在少数时段爆发，其余时间完全正常。</text>

  <!-- 短时抽样 -->
  <text class="l" x="20" y="176">短时抽样</text>
  <path class="win" d="M270 170 v12 h100 v-12"/>
  <text class="r" x="400" y="182">窗口恰好落在两段丢包之间 —— 误判为「线路正常」</text>

  <!-- 连续测量 -->
  <text class="l" x="20" y="248">连续测量</text>
  <path class="full" d="M120 242 v12 h640 v-12"/>
  <text class="g" x="130" y="278">覆盖完整时段，三段丢包全部被记录，结论才能反映真实体验。</text>

  <text class="s" x="20" y="318">测量时段越短，漏掉爆发时段的概率越高；这就是「延迟正常、体验卡顿，但每次测丢包都测不出来」的典型原因。</text>
</svg>
